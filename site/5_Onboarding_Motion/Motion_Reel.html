document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-size:11.5px;color:var(--ink2)\">5 veh<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;animation:rise .45s cubic-bezier(.16,1,.3,1) .72s both\"><span style=\"width:9px;height:9px;border-radius:999px;background:var(--accent)\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:700;flex:1\">L4 · أم درمان ← بحري<\u002Fspan><span style=\"font-family:'DM Sans',sans-serif;font-size:11.5px;color:var(--ink2)\">3 veh<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;animation:rise .45s cubic-bezier(.16,1,.3,1) .86s both\"><span style=\"width:9px;height:9px;border-radius:999px;background:var(--accent)\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:700;flex:1\">L5 · حلقة وسط المدينة<\u002Fspan><span style=\"font-family:'DM Sans',sans-serif;font-size:11.5px;color:var(--ink2)\">2 veh<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--accent-08);border:1px solid var(--accent-30);border-radius:14px;padding:14px;text-align:center;animation:pop .6s cubic-bezier(.34,1.42,.52,1) 1.05s both\">\n              <div style=\"font-size:11.5px;color:var(--ink2);margin-bottom:3px\">معدّل واحد للشبكة كلها<\u002Fdiv>\n              <div style=\"font-family:'DM Sans',sans-serif;font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-.02em\">1,250 <span style=\"font-size:12px;color:var(--ink2)\">SDG<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;margin-top:auto;animation:fade .5s ease 1.4s both\"><span style=\"width:7px;height:7px;border-radius:999px;background:var(--ok);animation:beat 1.8s ease-in-out 1.7s infinite\"><\u002Fspan><span style=\"font-size:11px;color:var(--ink2)\">سعة المقاعد محدودة بأربعة عشر<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-scene=\"s22\" data-screen-label=\"22\" style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;padding:64px 48px;scroll-snap-align:center;border-top:1px solid var(--bd)\">\n    <div style=\"flex:0 0 430px;max-width:430px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--accent);white-space:nowrap;flex:0 0 auto\">22 / 22<\u002Fspan>\n        <span style=\"height:1px;flex:1;background:var(--bd)\"><\u002Fspan>\n        <button sc-camel-on-click=\"{{ rp.s22 }}\" style=\"font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em;border:1px solid var(--bd);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 12px;cursor:pointer\">REPLAY<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ar }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin:0;text-wrap:pretty\">الطرد يتبع الطلب، لا العكس<\u002Fh2>\n          <p style=\"font-size:16.5px;line-height:1.7;color:var(--ink2);margin:0\">سودا إكسبرس تلتقط الطلب من السوق مباشرة — الملصق يُطبع من نفس السجل، والصندوق يخرج باسم السوق.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"direction:ltr;text-align:left;display:flex;flex-direction:column;gap:9px;padding-top:6px;border-top:1px solid var(--bd)\">\n          <h3 style=\"font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:0\">The parcel follows the order — never the reverse<\u002Fh3>\n          <p style=\"font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;color:var(--ink2);margin:0\">SudaExpress picks the order straight off Al Souq. The label prints from the same record, and the box leaves branded.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notes }}\">\n        <div style=\"background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;direction:ltr;text-align:left\">\n          <div style=\"font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--accent);margin-bottom:5px\">MOTION<\u002Fdiv>\n          <p style=\"font-family:'DM Sans',sans-serif;font-size:11.5px;line-height:1.6;color:var(--ink2);margin:0\">The order row appears before the parcel and stays on screen while the label attaches to it — the causality is the whole point. Flag stripes brush on last as a one-shot accent, not a palette.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:0 0 auto;width:320px;height:660px;border-radius:44px;background:#0E1726;padding:11px;box-shadow:0 30px 70px rgba(14,23,38,.22),0 6px 18px rgba(14,23,38,.12);position:relative\">\n      <div style=\"position:absolute;top:20px;left:50%;transform:translateX(-50%);width:94px;height:26px;border-radius:999px;background:#0E1726;z-index:20\"><\u002Fdiv>\n      <div style=\"width:100%;height:100%;border-radius:34px;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column\">\n        <div style=\"height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 4px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:var(--ink)\"><span>13:05<\u002Fspan><span style=\"opacity:.55\">▮▮▮ ▮<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ p.s22 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1;padding:16px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink2);font-family:'DM Sans',sans-serif;animation:fade .4s ease .05s both\">SUDAEXPRESS<\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--shadow-1);display:flex;align-items:center;gap:10px;animation:rise .5s cubic-bezier(.16,1,.3,1) .15s both\">\n              <span style=\"width:38px;height:38px;border-radius:12px;background:var(--accent-08);color:var(--accent);display:grid;place-items:center;flex:0 0 auto\"><x-import component-from-global-scope=\"AlSouqDesignSystem_8f9691.Icon\" name=\"cart\" size=\"19\" hint-size=\"19px,19px\"><\u002Fx-import><\u002Fspan>\n              <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:700\">طلب #4412<\u002Fdiv><div style=\"font-family:'DM Sans',sans-serif;font-size:10.5px;color:var(--ink2)\">3 items · 14,500 SDG<\u002Fdiv><\u002Fdiv>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:3px 8px\">PAID<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;place-items:center;animation:fade .4s ease .5s both\"><span style=\"color:var(--ink2);font-size:18px\">↓<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#C9A97E;border-radius:14px;padding:14px;box-shadow:var(--shadow-2);position:relative;overflow:hidden;animation:pop .6s cubic-bezier(.34,1.42,.52,1) .62s both\">\n              <div style=\"position:absolute;inset-block:14px;inset-inline-end:12px;width:88px;display:flex;flex-direction:column;justify-content:center;gap:7px\">\n                <span style=\"height:9px;border-radius:999px;background:#CE3B33;animation:fade .4s ease 1.05s both\"><\u002Fspan>\n                <span style=\"height:9px;border-radius:999px;background:#F4F1EA;animation:fade .4s ease 1.18s both\"><\u002Fspan>\n                <span style=\"height:9px;border-radius:999px;background:#3E9B54;animation:fade .4s ease 1.31s both\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-size:22px;font-weight:800;color:#1E1508;letter-spacing:-.02em\">السوق<\u002Fdiv>\n                <div style=\"font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;color:#4A3A22\">AL SOUQ<\u002Fdiv>\n                <div style=\"font-size:11px;color:#4A3A22;line-height:1.5;max-width:130px\">تسوّق بأمان · ادفع من المحفظة · استلم بسرعة<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px dashed var(--bd);border-radius:12px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;animation:rise .5s cubic-bezier(.16,1,.3,1) .88s both\">\n              <div><div style=\"font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink2)\">LABEL<\u002Fdiv><div style=\"font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:800\">SX-4412-KRT<\u002Fdiv><\u002Fdiv>\n              <span style=\"font-family:'DM Sans',sans-serif;font-size:10.5px;color:var(--ink2)\">from order #4412<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-1);animation:rise .5s cubic-bezier(.16,1,.3,1) 1.05s both\">\n              <div style=\"display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--bd)\"><span style=\"width:8px;height:8px;border-radius:999px;background:var(--ok)\"><\u002Fspan><span style=\"font-size:12px;font-weight:700;flex:1\">التقط من التاجر<\u002Fspan><span style=\"font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ink2)\">13:05<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--bd)\"><span style=\"width:8px;height:8px;border-radius:999px;background:var(--accent);animation:beat 1.6s ease-in-out infinite\"><\u002Fspan><span style=\"font-size:12px;font-weight:700;flex:1\">في الطريق<\u002Fspan><span style=\"font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ink2)\">now<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;padding:10px 12px;opacity:.5\"><span style=\"width:8px;height:8px;border-radius:999px;background:var(--bd)\"><\u002Fspan><span style=\"font-size:12px;font-weight:700;flex:1\">التسليم<\u002Fspan><span style=\"font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ink2)\">~42 min<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blue&quot;,&quot;earth&quot;],&quot;default&quot;:&quot;blue&quot;,&quot;tsType&quot;:&quot;'blue' | 'earth'&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;ar&quot;,&quot;en&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;'both' | 'ar' | 'en'&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    play: {}, lang: null, notes: null,\n    c: { wallet: 220000, topup: 0, settle: 0, points: 0, save: 0 }\n  };\n\n  constructor(p){ super(p); this.rootRef = React.createRef(); this.tweens = {}; }\n\n  componentDidMount(){\n    this.seen = new WeakSet();\n    this.io = new IntersectionObserver((es) => {\n      es.forEach(e => {\n        if (!e.isIntersecting) return;\n        const id = e.target.getAttribute('data-scene');\n        if (id && !this.state.play[id]) this.start(id);\n      });\n    }, { threshold: 0.2 });\n    this.scan();\n    // the template streams in, so keep picking up sections as they land\n    this.scanTimer = setInterval(() => this.scan(), 400);\n    setTimeout(() => { clearInterval(this.scanTimer); this.scanTimer = null; }, 12000);\n    this.onScroll = () => this.sweep();\n    addEventListener('scroll', this.onScroll, { passive: true });\n    addEventListener('resize', this.onScroll, { passive: true });\n    this.sweep();\n  }\n\n  scan(){\n    const root = this.rootRef.current;\n    if (!root) return;\n    root.querySelectorAll('[data-scene]').forEach(n => {\n      if (this.seen.has(n)) return;\n      this.seen.add(n);\n      this.io.observe(n);\n    });\n    this.sweep();\n  }\n\n  // belt-and-braces: anything already sitting in the viewport starts playing\n  sweep(){\n    const root = this.rootRef.current;\n    if (!root) return;\n    const vh = innerHeight;\n    root.querySelectorAll('[data-scene]').forEach(n => {\n      const id = n.getAttribute('data-scene');\n      if (!id || this.state.play[id]) return;\n      const r = n.getBoundingClientRect();\n      const visible = Math.min(r.bottom, vh) - Math.max(r.top, 0);\n      if (visible > Math.min(r.height, vh) * 0.35) this.start(id);\n    });\n  }\n\n  componentWillUnmount(){\n    if (this.io) this.io.disconnect();\n    if (this.scanTimer) clearInterval(this.scanTimer);\n    removeEventListener('scroll', this.onScroll);\n    removeEventListener('resize', this.onScroll);\n    Object.values(this.tweens).forEach(id => cancelAnimationFrame(id));\n  }\n\n  start(id){\n    this.setState(s => ({ play: { ...s.play, [id]: true } }), () => this.counters(id));\n  }\n\n  replay(id){\n    this.setState(s => ({ play: { ...s.play, [id]: false } }), () => {\n      setTimeout(() => this.start(id), 60);\n    });\n  }\n\n  tween(key, from, to, dur, delay){\n    cancelAnimationFrame(this.tweens[key]);\n    const t0 = performance.now() + (delay || 0);\n    const step = (now) => {\n      const p = Math.max(0, Math.min(1, (now - t0) / dur));\n      const e = 1 - Math.pow(1 - p, 3);\n      this.setState(s => ({ c: { ...s.c, [key]: from + (to - from) * e } }));\n      if (p < 1) this.tweens[key] = requestAnimationFrame(step);\n    };\n    this.setState(s => ({ c: { ...s.c, [key]: from } }));\n    this.tweens[key] = requestAnimationFrame(step);\n  }\n\n  counters(id){\n    if (id === 's6') this.tween('wallet', 220000, 95000, 1500, 500);\n    if (id === 's8') this.tween('topup', 0, 95000, 1400, 450);\n    if (id === 's15') this.tween('settle', 0, 118500, 1500, 600);\n    if (id === 's16') this.tween('points', 1180, 1430, 1600, 500);\n    if (id === 's18') this.tween('save', 0, 30, 1200, 600);\n  }\n\n  fmt(n){ return Math.round(n).toLocaleString('en-US'); }\n\n  renderVals(){\n    const lang = this.state.lang || this.props.lang || 'both';\n    const notes = this.state.notes === null ? (this.props.showNotes ?? false) : this.state.notes;\n    const p = {}, rp = {};\n    for (let i = 1; i <= 22; i++){\n      const id = 's' + i;\n      p[id] = !!this.state.play[id];\n      rp[id] = () => this.replay(id);\n    }\n    const c = this.state.c;\n    return {\n      rootRef: this.rootRef, p, rp, notes,\n      theme: this.props.theme || 'blue',\n      tierPoints: 1430, tierNextAt: 2300,\n      ar: lang !== 'en',\n      en: lang !== 'ar',\n      c: {\n        wallet: this.fmt(c.wallet), topup: this.fmt(c.topup),\n        settle: this.fmt(c.settle), points: this.fmt(c.points),\n        save: Math.round(c.save)\n      },\n      setBoth: () => this.setState({ lang: 'both' }),\n      setAr: () => this.setState({ lang: 'ar' }),\n      setEn: () => this.setState({ lang: 'en' }),\n      toggleNotes: () => this.setState({ notes: !notes })\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
