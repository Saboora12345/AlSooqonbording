<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دورة حياة الطلب · Order Lifecycle — alSooq OMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#F6F1E7; --sand-deep:#EDE4D3; --ink:#2E241B; --ink-soft:#6B5B4B;
  --clay:#8A4B2A; --palm:#2F6B4F; --palm-deep:#1E4634; --palm-tint:#E3EFE8;
  --card:#FFFFFF; --line:#DCCFBB; --kraft:#E4D2B4; --gold:#B8862F; --flag-red:#C8322B;

  /* gravity = accelerates (falls) · brake = decelerates (arrives)
     settle  = damped, heavy   · spring = light, ~10% overshoot     */
  --gravity:cubic-bezier(.55,.06,.68,.19);
  --brake:cubic-bezier(.16,1,.3,1);
  --settle:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.42,.52,1);
  --snap:cubic-bezier(.4,0,.2,1);
  --ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --en:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--sand-deep);overflow:hidden}
body{font-family:var(--ar);color:var(--ink);display:grid;place-items:center;
  -webkit-font-smoothing:antialiased}
#stage{width:1280px;height:720px;background:var(--sand);position:relative;overflow:hidden;
  transform-origin:center;box-shadow:0 12px 40px rgba(46,36,27,.14);
  display:flex;flex-direction:column;padding:40px 60px 26px}

/* ---------------- chrome ---------------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;flex:0 0 auto}
.bl{display:flex;align-items:center;gap:13px}
.plate{width:70px;height:44px;border-radius:7px;background:var(--kraft);display:grid;place-items:center}
.plate svg{width:55px;height:30px}
.plate path{fill:none;stroke-width:5.4;stroke-linecap:round}
.bl .w{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1}
.bl .w small{display:block;font-family:var(--en);font-size:9.5px;font-weight:600;
  color:var(--ink-soft);margin-top:2px}
.jt{text-align:left}
.jt .a{font-size:18px;font-weight:700}
.jt .b{font-family:var(--en);font-size:10px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.oid{display:inline-block;margin-top:8px;font-family:var(--en);font-size:11px;font-weight:600;
  letter-spacing:.08em;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:4px 10px}

/* ---------------- lanes ---------------- */
.diagram{position:relative;flex:1 1 auto;min-height:0;margin-top:16px}
.lane{position:absolute;right:0;left:0;height:0}
.lanelab{position:absolute;right:0;top:-19px;width:176px;text-align:left;padding-left:14px}
.lanelab .n{font-size:15px;font-weight:700;line-height:1.2}
.lanelab .e{font-family:var(--en);direction:ltr;font-size:9.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px;
  text-align:right}
.lane .track{position:absolute;right:186px;left:0;top:0;height:1px;background:var(--line)}
.lane.ctrl .track{background:transparent;border-top:2px dashed var(--palm);opacity:.55}
.lane.ctrl .lanelab .n{color:var(--palm)}
.lanetint{position:absolute;right:186px;left:0;height:46px;border-radius:9px;
  background:var(--palm-tint);opacity:0;transition:opacity .5s var(--snap)}
.lane.on .lanetint{opacity:.55}

/* coordinate field */
.field{position:absolute;right:186px;left:0;top:0;bottom:0;pointer-events:none}

/* node dots */
.nd{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--sand);
  border:2px solid var(--line);margin:-5.5px -5.5px 0 0;transition:all .45s var(--spring)}
.nd.hit{background:var(--palm);border-color:var(--palm)}
.nd.hit.now{transform:scale(1.45)}

/* travelled path segments */
.seg{position:absolute;height:2px;background:var(--palm);border-radius:2px;
  transform-origin:right center;transform:scaleX(0);transition:transform .8s var(--brake)}
.seg.on{transform:scaleX(1)}

/* ---------- the monitoring tether ---------- */
.tether{position:absolute;width:0;border-left:1px dashed var(--palm);opacity:0;
  transition:top 1.05s var(--brake),height 1.05s var(--brake),right 1.15s var(--brake),opacity .4s}
.tether.on{opacity:.85}
.tetherdot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--palm);
  margin:-3.5px -3.5px 0 0;opacity:0;transition:all 1.05s var(--brake)}
.tetherdot.on{opacity:1}

/* ---------- the order token ---------- */
.token{position:absolute;display:flex;align-items:center;gap:9px;
  background:var(--card);border:1px solid var(--palm);border-radius:10px;
  padding:9px 13px;white-space:nowrap;z-index:5;
  box-shadow:0 2px 4px rgba(46,36,27,.06),0 10px 24px rgba(46,36,27,.10);
  margin-top:-21px;
  transition:right .95s var(--brake),top .78s var(--gravity) .08s,transform .5s var(--settle)}
.token .ic{width:22px;height:22px;display:grid;place-items:center;flex:0 0 22px}
.token .ic svg{width:19px;height:19px;fill:none;stroke:var(--palm);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.token .tx{font-size:13.5px;font-weight:700;line-height:1.15}
.token .tx small{display:block;font-family:var(--en);font-size:9.5px;font-weight:600;
  color:var(--ink-soft);letter-spacing:.07em;margin-top:2px}
.token.moving{transform:rotate(-1.4deg)}
.pulse{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid var(--palm);
  margin:-26px -26px 0 0;opacity:0;z-index:4}
.pulse.fire{animation:pOut 1.05s var(--brake) forwards}
@keyframes pOut{0%{transform:scale(.5);opacity:.85}100%{transform:scale(2.4);opacity:0}}

/* ---------------- copy ---------------- */
.copy{flex:0 0 auto;margin-top:14px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:44px}
.copy .mask{overflow:hidden;height:52px}
.copy h2{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.26;
  transform:translateY(108%)}
.copy h2.go{transform:translateY(0);transition:transform .7s var(--brake)}
.copy .en{font-family:var(--en);direction:ltr;font-size:17px;font-weight:600;
  color:var(--ink-soft);margin-top:7px;opacity:0;transform:translateY(8px)}
.copy .en.go{opacity:1;transform:none;transition:all .55s var(--brake) .1s}
.copyR{width:470px;flex:0 0 470px}
.stateline{display:flex;align-items:center;gap:10px;justify-content:flex-start}
.state{display:inline-block;background:var(--palm);color:var(--sand);border-radius:999px;
  padding:7px 17px;font-size:13.5px;font-weight:700;opacity:0;transform:scale(.88)}
.state.go{opacity:1;transform:none;transition:all .45s var(--spring)}
.owner{font-family:var(--en);font-size:10px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .4s .15s}
.owner.go{opacity:1}
.log{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.lg{display:flex;align-items:baseline;gap:10px;padding:3.5px 0;opacity:.45}
.lg:first-child{opacity:1}
.lg .t{font-family:var(--en);font-size:10.5px;font-weight:700;color:var(--palm);
  letter-spacing:.06em;flex:0 0 52px}
.lg .m{font-size:13px;font-weight:500;color:var(--ink-soft);line-height:1.35}
.lg.fresh{animation:logIn .5s var(--brake) both}
@keyframes logIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}

/* ---------------- rail ---------------- */
.rail{flex:0 0 auto;margin-top:18px}
.track2{position:relative;height:2px;background:var(--line)}
.track2 .fill{position:absolute;top:0;right:0;height:2px;background:var(--palm);width:0;
  transition:width .85s var(--settle)}
.nodes{display:flex;justify-content:space-between;margin-top:-6px}
.node{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;flex:1}
.node .dot{width:12px;height:12px;border-radius:50%;background:var(--sand);
  border:2px solid var(--line);transition:all .4s var(--spring)}
.node.done .dot{background:var(--palm);border-color:var(--palm)}
.node.now .dot{background:var(--palm);border-color:var(--palm);transform:scale(1.5)}
.node .t{font-size:11.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.node.now .t{color:var(--ink);font-weight:700}

.ctrlbar{position:absolute;bottom:7px;right:60px;font-family:var(--en);font-size:10px;
  letter-spacing:.05em;color:var(--ink-soft);z-index:9}
kbd{border:1px solid var(--line);border-radius:3px;padding:1px 5px;background:var(--card);font-size:9px}
.mnote{position:absolute;bottom:52px;left:60px;max-width:400px;z-index:9;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:13px 16px;display:none}
.mnote.show{display:block}
.mnote h4{font-family:var(--en);font-size:9.5px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--palm);margin-bottom:6px}
.mnote p{font-family:var(--en);direction:ltr;font-size:11.5px;line-height:1.6;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div id="stage">

  <div class="top">
    <div class="bl">
      <div class="plate"><svg viewBox="0 0 55 30">
        <path d="M4 7 C17 3, 39 9, 51 5" stroke="var(--flag-red)"/>
        <path d="M4 15 C18 11, 38 19, 51 14" stroke="#FFFFFF"/>
        <path d="M4 23 C17 19, 40 26, 51 22" stroke="var(--palm)"/></svg></div>
      <div class="w">السوق<small>alSooq</small></div>
    </div>
    <div class="jt">
      <div class="a">دورة حياة الطلب</div>
      <div class="b">Order Lifecycle · OMS</div>
      <div class="oid">ORD-2026-0731-0142</div>
    </div>
  </div>

  <div class="diagram" id="diagram">
    <div class="lane ctrl" id="lane0"><div class="lanetint"></div><div class="track"></div>
      <div class="lanelab"><div class="n">نظام إدارة الطلبات</div><div class="e">OMS · Control</div></div></div>
    <div class="lane" id="lane1"><div class="lanetint"></div><div class="track"></div>
      <div class="lanelab"><div class="n">العميل</div><div class="e">Customer</div></div></div>
    <div class="lane" id="lane2"><div class="lanetint"></div><div class="track"></div>
      <div class="lanelab"><div class="n">التاجر</div><div class="e">Merchant</div></div></div>
    <div class="lane" id="lane3"><div class="lanetint"></div><div class="track"></div>
      <div class="lanelab"><div class="n">سودا إكسبريس</div><div class="e">Courier</div></div></div>

    <div class="field" id="field">
      <div class="tether" id="tether"></div>
      <div class="tetherdot" id="tdot"></div>
      <div class="pulse" id="pulse"></div>
      <div class="token" id="token">
        <span class="ic" id="tokicon"></span>
        <span class="tx" id="toktx">طلب جديد<small>ORD-0142</small></span>
      </div>
    </div>
  </div>

  <div class="copy">
    <div>
      <div class="mask"><h2 id="ttl"></h2></div>
      <div class="en" id="ten"></div>
    </div>
    <div class="copyR">
      <div class="stateline">
        <span class="state" id="state"></span>
        <span class="owner" id="owner"></span>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="rail">
    <div class="track2"><div class="fill" id="fill"></div></div>
    <div class="nodes" id="nodes"></div>
  </div>

  <div class="ctrlbar"><kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step · <kbd>R</kbd> replay · <kbd>M</kbd> motion notes</div>
  <div class="mnote" id="mnote"><h4>Motion technique</h4><p id="mtext"></p></div>

</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){stage.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)*0.95+')';}
  addEventListener('resize',fit);fit();

  var ICON={
    cart:'<path d="M2 3h3l2.4 10.2A2 2 0 0 0 9.3 15h7.1a2 2 0 0 0 2-1.6L19.6 6H6"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/>',
    bell:'<path d="M12 3a5 5 0 0 0-5 5v3.5L5.5 15h13L17 11.5V8a5 5 0 0 0-5-5z"/><path d="M10 18a2 2 0 0 0 4 0"/>',
    box:'<path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/>',
    truck:'<rect x="2" y="7" width="12" height="9" rx="1.5"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
    radar:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12l5-5"/>',
    home:'<path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M9.5 20v-6h5v6"/>',
    wallet:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.2"/>'
  };

  /* lane 0 = OMS control plane (top) */
  var LANES=[0.10,0.40,0.66,0.90];

  var ACTS=[
    {lane:1,x:7, icon:'cart', tok:'طلب جديد',
     ar:'العميل يرسل الطلب', en:'Customer places the order',
     st:'مستلم', own:'Owner · Customer', t:'09:41',
     log:'تم إنشاء الطلب من تطبيق العميل.',
     m:'The token enters on a braking curve — it arrives and settles rather than sliding to a stop. Nothing else on the stage moves yet; a single object in motion reads as intent, five objects read as noise.'},

    {lane:0,x:19, icon:'check', tok:'تم التحقق',
     ar:'النظام يتحقق ويحجز المبلغ', en:'OMS validates and holds funds',
     st:'مؤكد', own:'Owner · OMS', t:'09:41',
     log:'التحقق من المخزون · حجز المبلغ في محفظة حِوال.',
     m:'The token rises INTO the control lane, so the vertical transition uses a braking curve here — rising objects decelerate. Everywhere else the vertical move falls, and switches to the gravity curve. Same component, opposite physics, decided by direction.'},

    {lane:2,x:31, icon:'bell', tok:'إشعار التاجر',
     ar:'الإرسال إلى التاجر', en:'Dispatched to the merchant',
     st:'بانتظار القبول', own:'Owner · Merchant', t:'09:42',
     log:'إشعار للتاجر · مهلة القبول ١٥ دقيقة.',
     m:'This is the dispatch. The token FALLS two lanes on the gravity curve while the horizontal move runs 170ms longer — the mismatch bends the path into an arc. A pulse fires on arrival, expanding outward and dissipating: the merchant device ringing.'},

    {lane:2,x:43, icon:'box', tok:'قيد التجهيز',
     ar:'التاجر يقبل ويجهّز', en:'Merchant accepts and packs',
     st:'قيد التجهيز', own:'Owner · Merchant', t:'09:56',
     log:'قبول الطلب · تجهيز وتغليف · طباعة البطاقة.',
     m:'A short lateral move inside the same lane. Distance carries meaning: staying in a lane means the order changed state, not custody. Crossing a lane means it changed hands.'},

    {lane:3,x:55, icon:'truck', tok:'إسناد الشحن',
     ar:'إسناد الشحنة للناقل', en:'Assigned to Sudan Express',
     st:'جاهز للاستلام', own:'Owner · Courier', t:'10:20',
     log:'إسناد المهمة · تأكيد موعد الاستلام.',
     m:'Custody passes to the courier lane, and the tether stretches to its longest span. It never breaks — the OMS is still the system of record even when the parcel is physically in someone else\'s hands.'},

    {lane:3,x:67, icon:'radar', tok:'قيد التوصيل',
     ar:'التتبّع المباشر أثناء النقل', en:'Monitored in transit',
     st:'في الطريق', own:'Owner · Courier', t:'10:48',
     log:'تحديث الموقع · الوقت المتوقع للوصول ٣٥ دقيقة.',
     m:'The tether is the whole idea of this scene. It runs 1.05s against the token\'s 0.95s, so it lags a fraction behind — secondary motion. A line that tracked perfectly would read as a drawn connector; one that trails reads as something holding on.'},

    {lane:1,x:80, icon:'home', tok:'تم التسليم',
     ar:'التسليم وإثبات الاستلام', en:'Delivered, with proof',
     st:'تم التسليم', own:'Owner · Customer', t:'11:23',
     log:'تسليم للعميل · تأكيد برمز التحقق.',
     m:'The token climbs back to the customer lane — a braking curve again, since it rises. The pulse fires a second time, rhyming with the dispatch beat and closing the loop the delivery opened.'},

    {lane:2,x:92, icon:'wallet', tok:'تسوية',
     ar:'تحرير المبلغ للتاجر', en:'Settlement released to merchant',
     st:'تمت التسوية', own:'Owner · Merchant', t:'11:24',
     log:'تحرير الحجز · إيداع صافي المبلغ في محفظة التاجر.',
     m:'The final fall lands on the merchant lane, not the customer\'s — money moves in the opposite direction to goods, and the diagram says so without a caption. The tether releases last, after the deposit: follow-through on the whole sequence.'}
  ];

  var field=document.getElementById('field'), token=document.getElementById('token'),
      tether=document.getElementById('tether'), tdot=document.getElementById('tdot'),
      pulse=document.getElementById('pulse'), diagram=document.getElementById('diagram'),
      ttl=document.getElementById('ttl'), ten=document.getElementById('ten'),
      state=document.getElementById('state'), owner=document.getElementById('owner'),
      logEl=document.getElementById('log'), fill=document.getElementById('fill'),
      nodesEl=document.getElementById('nodes'), mnote=document.getElementById('mnote'),
      mtext=document.getElementById('mtext');

  var i=0,timer=null,playing=true,laneY=[];

  function layout(){
    var H=diagram.clientHeight;
    laneY=LANES.map(function(f){return Math.round(H*f);});
    for(var L=0;L<4;L++) document.getElementById('lane'+L).style.top=laneY[L]+'px';
    var tints=document.querySelectorAll('.lanetint');
    for(var k=0;k<tints.length;k++) tints[k].style.top=(laneY[k]-23)+'px';
    // node dots
    field.querySelectorAll('.nd,.seg').forEach(function(n){n.remove();});
    ACTS.forEach(function(a,n){
      var d=document.createElement('div');
      d.className='nd'; d.dataset.n=n;
      d.style.right=a.x+'%'; d.style.top=laneY[a.lane]+'px';
      field.appendChild(d);
    });
    place(false);
  }

  function place(animate){
    var a=ACTS[i];
    if(!animate) token.style.transition='none';
    token.style.right=a.x+'%';
    token.style.top=laneY[a.lane]+'px';
    if(!animate){ void token.offsetWidth; token.style.transition=''; }

    // tether: OMS control lane -> token
    var top=Math.min(laneY[0],laneY[a.lane]), h=Math.abs(laneY[a.lane]-laneY[0]);
    tether.style.right='calc('+a.x+'% + 0px)';
    tether.style.top=top+'px'; tether.style.height=h+'px';
    tether.classList.toggle('on', a.lane!==0);
    tdot.style.right=a.x+'%'; tdot.style.top=laneY[0]+'px';
    tdot.classList.toggle('on', a.lane!==0);

    // lane highlight
    for(var L=0;L<4;L++)
      document.getElementById('lane'+L).classList.toggle('on', L===a.lane||L===0);

    // dots + travelled segments
    field.querySelectorAll('.nd').forEach(function(d){
      var n=+d.dataset.n;
      d.classList.toggle('hit',n<=i);
      d.classList.toggle('now',n===i);
    });
  }

  function firePulse(){
    pulse.style.right=ACTS[i].x+'%';
    pulse.style.top=laneY[ACTS[i].lane]+'px';
    pulse.classList.remove('fire'); void pulse.offsetWidth; pulse.classList.add('fire');
  }

  ACTS.forEach(function(a,n){
    var el=document.createElement('div');
    el.className='node';
    el.innerHTML='<span class="dot"></span><span class="t">'+a.st+'</span>';
    el.addEventListener('click',function(){pause();go(n);});
    nodesEl.appendChild(el);
  });
  var nodeEls=[].slice.call(nodesEl.children);

  function go(n){
    i=(n+ACTS.length)%ACTS.length;
    var a=ACTS[i];

    token.classList.add('moving');
    setTimeout(function(){token.classList.remove('moving');},520);
    place(true);
    document.getElementById('tokicon').innerHTML='<svg viewBox="0 0 24 24">'+ICON[a.icon]+'</svg>';
    document.getElementById('toktx').innerHTML=a.tok+'<small>ORD-0142</small>';
    if(i===2||i===6) setTimeout(firePulse,900);

    [ttl,ten,state,owner].forEach(function(e){e.classList.remove('go');});
    ttl.textContent=a.ar; ten.textContent=a.en;
    state.textContent=a.st; owner.textContent=a.own;
    void ttl.offsetWidth;
    [ttl,ten,state,owner].forEach(function(e){e.classList.add('go');});

    // event log — newest on top, only the newest animates
    var rows=[];
    for(var k=i;k>=0&&rows.length<3;k--) rows.push(ACTS[k]);
    logEl.innerHTML='';
    rows.forEach(function(r,idx){
      var d=document.createElement('div');
      d.className='lg'+(idx===0?' fresh':'');
      d.innerHTML='<span class="t">'+r.t+'</span><span class="m">'+r.log+'</span>';
      logEl.appendChild(d);
    });

    nodeEls.forEach(function(el,k){
      el.classList.toggle('done',k<i); el.classList.toggle('now',k===i);
    });
    fill.style.width=(i/(ACTS.length-1)*100)+'%';
    mtext.textContent=a.m;

    clearTimeout(timer);
    if(playing) timer=setTimeout(function(){go(i+1);},4600);
  }
  function pause(){playing=false;clearTimeout(timer);}
  function play(){playing=true;go(i);}

  addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(e.key===' '){e.preventDefault(); playing?pause():play();}
    else if(e.key==='ArrowRight'){e.preventDefault();pause();go(i+1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();pause();go(i-1);}
    else if(k==='r'){go(i);}
    else if(k==='m'){mnote.classList.toggle('show');}
  });

  addEventListener('resize',layout);
  layout(); go(0);
})();
</script>
</body>
</html>
