name: Deploy alSooq to GitHub Pages

# Publishes the static, self-contained alSooq prototype (index = home, the
# app, dashboard, onboarding, and the site/ reference set) to GitHub Pages.
# No build step — the repository is served as-is.

on:
  push:
    branches: [main, master, claude/taste-create-alsooq-home-deploy-agxrq1]
  workflow_dispatch:

# Least-privilege token scoped for Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; don't cancel a run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # Requires Pages to be enabled once via Settings → Pages →
        # Source: GitHub Actions. The Actions GITHUB_TOKEN only has write
        # scope (not admin), so it cannot enable Pages itself — that first
        # toggle is a one-time manual step by a repo admin. After that,
        # every push here deploys automatically.
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
